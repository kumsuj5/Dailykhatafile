<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DailyKhata — Legal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #4F46E5 0%, #3730A3 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #0F172A;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .logo {
      width: 72px;
      height: 72px;
      background: #EEF2FF;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 36px;
    }
    h1 { font-size: 28px; color: #4F46E5; margin-bottom: 8px; }
    p { color: #64748B; margin-bottom: 32px; line-height: 1.6; }
    a {
      display: block;
      padding: 14px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 12px;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.9; }
    .primary { background: #4F46E5; color: #fff; }
    .secondary { background: #F1F5F9; color: #4F46E5; }
    .footer { font-size: 13px; color: #94A3B8; margin-top: 24px; margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">💰</div>
    <h1>DailyKhata</h1>
    <p>Personal offline expense manager.<br />Legal documents for our users.</p>
    <a class="primary" href="privacy-policy.html">Privacy Policy</a>
    <a class="secondary" href="terms-and-conditions.html">Terms &amp; Conditions</a>
    <p class="footer">Developed by Sujit Kumar<br />kumsuj5@gmail.com<br />Last updated: June 11, 2026</p>
  </div>
</body>
</html>
